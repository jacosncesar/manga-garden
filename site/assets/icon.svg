<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="manga-garden-title manga-garden-desc">
  <title id="manga-garden-title">MangaGarden</title>
  <desc id="manga-garden-desc">A glowing angular M monogram with an open-book base and a sprout, framed in purple and cyan neon.</desc>
  <defs>
    <linearGradient id="frame" x1="14" y1="25" x2="114" y2="103" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B54CFF"/>
      <stop offset=".52" stop-color="#8C68FF"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>
    <linearGradient id="letter" x1="31" y1="45" x2="98" y2="87" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4A8FF"/>
      <stop offset=".48" stop-color="#8B55FF"/>
      <stop offset="1" stop-color="#24DFFF"/>
    </linearGradient>
    <linearGradient id="sprout" x1="52" y1="21" x2="76" y2="39" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B6FF75"/>
      <stop offset="1" stop-color="#24E8C2"/>
    </linearGradient>
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="#03030A"/>
  <path d="M25 12h24l8 7h14l8-7h24l13 13v22l-6 7v20l6 7v22l-13 13H79l-8-7H57l-8 7H25l-13-13V81l6-7V54l-6-7V25z"
    fill="none" stroke="url(#frame)" stroke-width="2" filter="url(#neon-glow)"/>
  <path d="M31 91V40l32 30 34-31v52" fill="none" stroke="url(#letter)" stroke-width="7" stroke-linecap="square" stroke-linejoin="bevel" filter="url(#neon-glow)"/>
  <path d="M42 81V61l21 20 22-20v20" fill="none" stroke="#171529" stroke-width="3" stroke-linecap="square" stroke-linejoin="bevel"/>
  <path d="M64 39V25" fill="none" stroke="url(#sprout)" stroke-width="3" stroke-linecap="round" filter="url(#neon-glow)"/>
  <path d="M63 29c-10-1-15-6-14-12 8 0 14 3 15 10M65 27c2-8 8-12 16-11 0 7-5 12-15 14" fill="url(#sprout)" stroke="#C6FF9A" stroke-width="1" stroke-linejoin="round" filter="url(#neon-glow)"/>
  <path d="M43 99c8-3 14-2 21 2 7-4 13-5 21-2M64 101v7M43 99v5c8-2 14 0 21 4 7-4 13-6 21-4v-5"
    fill="none" stroke="url(#frame)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)"/>
</svg>
